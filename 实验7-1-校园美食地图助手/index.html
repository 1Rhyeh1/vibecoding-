<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校园美食地图助手</title>
<style>
  :root{
    --brand-1:#ff6b4a;
    --brand-2:#ff9f45;
    --brand-3:#ff5c8a;
    --ink:#1f2430;
    --ink-soft:#3a4152;
    --muted:#7a8194;
    --line:rgba(15,23,42,.08);
    --glass:rgba(255,255,255,.74);
    --glass-strong:rgba(255,255,255,.9);
    --radius-xl:26px;
    --radius-lg:20px;
    --radius-md:14px;
    --shadow-lg:0 24px 60px -24px rgba(255,107,74,.45), 0 10px 30px -14px rgba(15,23,42,.18);
    --shadow-md:0 10px 28px -14px rgba(15,23,42,.28);
    --grad:linear-gradient(135deg,#ff6b4a 0%,#ff9f45 52%,#ff5c8a 100%);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:"Inter","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    color:var(--ink);
    background:#f6f4f1;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  .orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:.5;pointer-events:none;z-index:0;}
  .orb-1{width:520px;height:520px;background:radial-gradient(circle,#ffb199,#ffd6a5 70%);top:-180px;left:-120px;}
  .orb-2{width:460px;height:460px;background:radial-gradient(circle,#ffc7d9,#ffe3c2 70%);bottom:-200px;right:-120px;}
  .orb-3{width:320px;height:320px;background:radial-gradient(circle,#d9f0ff,#e8f6ff 70%);top:38%;left:46%;opacity:.35;}
  .topbar{
    position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;
    gap:16px;padding:16px 28px;height:92px;
  }
  .brand{display:flex;align-items:center;gap:14px;}
  .brand-mark{
    width:50px;height:50px;border-radius:16px;background:var(--grad);
    display:grid;place-items:center;box-shadow:0 12px 26px -10px rgba(255,107,74,.7);
    position:relative;overflow:hidden;
  }
  .brand-mark::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.45),transparent 55%);}
  .brand-mark svg{width:26px;height:26px;position:relative;z-index:1;}
  .brand h1{font-size:20px;letter-spacing:.2px;font-weight:700;}
  .brand p{font-size:11px;color:var(--muted);letter-spacing:1.6px;text-transform:uppercase;margin-top:2px;}
  .topbar-actions{display:flex;align-items:center;gap:10px;}
  .loc-chip{
    display:flex;align-items:center;gap:9px;padding:9px 16px;border-radius:999px;
    background:var(--glass);border:1px solid rgba(255,255,255,.75);
    backdrop-filter:blur(16px);box-shadow:var(--shadow-md);
    font-size:13px;color:var(--ink-soft);max-width:380px;
  }
  .loc-chip .dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.16);flex:none;}
  .loc-chip .dot.pending{background:#f59e0b;box-shadow:0 0 0 4px rgba(245,158,11,.16);animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  #locText{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .btn{
    border:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;
    padding:10px 18px;border-radius:12px;transition:.22s ease;display:inline-flex;align-items:center;gap:7px;
    white-space:nowrap;
  }
  .btn svg{width:15px;height:15px;}
  .btn.primary{background:var(--grad);color:#fff;box-shadow:0 10px 22px -10px rgba(255,92,138,.75);}
  .btn.primary:hover{transform:translateY(-1px);box-shadow:0 14px 26px -10px rgba(255,92,138,.85);}
  .btn.ghost{background:var(--glass);color:var(--ink-soft);border:1px solid rgba(255,255,255,.8);backdrop-filter:blur(14px);box-shadow:var(--shadow-md);}
  .btn.ghost:hover{background:#fff;}
  .btn.tiny{padding:7px 13px;font-size:12px;border-radius:10px;background:#fff;color:var(--brand-1);border:1px solid rgba(255,107,74,.3);}
  .btn.tiny:hover{background:var(--grad);color:#fff;border-color:transparent;}
  .layout{
    position:relative;z-index:3;display:grid;grid-template-columns:minmax(370px,430px) minmax(0,1fr);
    gap:20px;padding:0 28px 24px;height:calc(100vh - 92px);max-width:1640px;margin:0 auto;
  }
  .panel{
    background:var(--glass);border:1px solid rgba(255,255,255,.78);border-radius:var(--radius-xl);
    backdrop-filter:blur(20px);box-shadow:var(--shadow-lg);
    display:flex;flex-direction:column;min-height:0;padding:18px 18px 12px;
  }
  .search-row{display:flex;gap:10px;}
  .search-box{
    flex:1;display:flex;align-items:center;gap:9px;padding:0 14px;height:46px;
    background:#fff;border-radius:14px;border:1.5px solid rgba(15,23,42,.06);
    box-shadow:inset 0 1px 3px rgba(15,23,42,.04);transition:.2s;
  }
  .search-box:focus-within{border-color:rgba(255,107,74,.55);box-shadow:0 0 0 4px rgba(255,107,74,.12);}
  .search-box svg{width:18px;height:18px;color:var(--muted);flex:none;}
  .search-box input{border:none;outline:none;background:transparent;font-family:inherit;font-size:14px;width:100%;color:var(--ink);}
  .search-box input::placeholder{color:#a9afbe;}
  .quick-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
  .quick-tag{
    border:1px solid rgba(255,107,74,.18);background:rgba(255,107,74,.07);color:#d1502f;
    font-size:12px;padding:6px 13px;border-radius:999px;cursor:pointer;transition:.18s;font-family:inherit;
  }
  .quick-tag:hover{background:rgba(255,107,74,.15);transform:translateY(-1px);}
  .filters{display:flex;flex-direction:column;gap:9px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);}
  .filter-group{display:flex;align-items:center;gap:10px;}
  .filter-label{font-size:12px;color:var(--muted);width:30px;flex:none;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{
    border:1px solid transparent;background:rgba(15,23,42,.045);color:var(--ink-soft);
    font-size:12px;padding:5px 12px;border-radius:999px;cursor:pointer;transition:.18s;font-family:inherit;
  }
  .chip:hover{background:rgba(15,23,42,.09);}
  .chip.active{background:var(--grad);color:#fff;box-shadow:0 6px 14px -8px rgba(255,92,138,.9);}
  .list-head{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 10px;gap:8px;flex-wrap:wrap;}
  .list-head h2{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;}
  .count{
    background:rgba(255,107,74,.12);color:#d1502f;font-size:11px;padding:2px 9px;border-radius:999px;font-weight:600;
  }
  .sort-group{display:flex;background:rgba(15,23,42,.045);border-radius:10px;padding:3px;}
  .sort-btn{
    border:none;background:transparent;font-family:inherit;font-size:11.5px;color:var(--muted);
    padding:6px 11px;border-radius:8px;cursor:pointer;transition:.2s;
  }
  .sort-btn.active{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(15,23,42,.12);font-weight:600;}
  .list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:2px 4px 72px 2px;}
  .list::-webkit-scrollbar{width:6px;}
  .list::-webkit-scrollbar-thumb{background:rgba(15,23,42,.14);border-radius:99px;}
  .list::-webkit-scrollbar-track{background:transparent;}
  .food-card{
    background:var(--glass-strong);border:1px solid rgba(255,255,255,.9);border-radius:var(--radius-lg);
    padding:13px 14px;cursor:pointer;transition:.22s cubic-bezier(.2,.7,.3,1.2);
    box-shadow:0 6px 18px -14px rgba(15,23,42,.35);position:relative;overflow:hidden;
  }
  .food-card::before{
    content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:9px;
    background:var(--grad);opacity:0;transition:.2s;
  }
  .food-card:hover{transform:translateY(-2px);box-shadow:0 16px 30px -18px rgba(15,23,42,.4);background:#fff;}
  .food-card:hover::before,.food-card.selected::before{opacity:1;}
  .food-card.selected{background:#fff;box-shadow:0 16px 34px -18px rgba(255,107,74,.55);border-color:rgba(255,107,74,.35);}
  .card-top{display:flex;gap:11px;}
  .rank{
    width:30px;height:30px;flex:none;border-radius:10px;display:grid;place-items:center;
    font-weight:800;font-size:12.5px;color:#fff;background:var(--grad);box-shadow:0 6px 12px -6px rgba(255,107,74,.8);
  }
  .food-card:nth-child(n+4) .rank{background:rgba(15,23,42,.1);color:var(--muted);box-shadow:none;}
  .card-main{flex:1;min-width:0;}
  .card-title-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .card-title-row h3{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rating{display:flex;align-items:center;gap:3px;font-size:12.5px;font-weight:700;color:#e8641b;flex:none;}
  .rating svg{width:12px;height:12px;}
  .card-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;}
  .badge{font-size:11px;padding:2.5px 9px;border-radius:999px;font-weight:500;}
  .badge.cuisine{background:rgba(255,107,74,.1);color:#c94e2c;}
  .badge.price{background:rgba(34,197,94,.1);color:#168a45;}
  .badge.dist{background:rgba(59,130,246,.1);color:#1d6dd1;}
  .reason{font-size:11.8px;color:var(--muted);line-height:1.55;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .card-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:9px;}
  .empty{
    text-align:center;padding:48px 16px;color:var(--muted);font-size:13px;line-height:1.8;
  }
  .empty svg{width:46px;height:46px;color:rgba(255,107,74,.35);margin-bottom:10px;}
  .map-wrap{
    position:relative;border-radius:var(--radius-xl);overflow:hidden;
    background:linear-gradient(160deg,#eef3f8,#e8eef5);border:1px solid rgba(255,255,255,.8);
    box-shadow:var(--shadow-lg);min-height:0;
  }
  #map{position:absolute;inset:0;width:100%;height:100%;}
  .map-placeholder{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;text-align:center;padding:30px;background:
      radial-gradient(circle at 30% 30%,rgba(255,159,69,.12),transparent 55%),
      radial-gradient(circle at 75% 70%,rgba(255,92,138,.12),transparent 50%),
      linear-gradient(160deg,#f7f9fc,#eef2f8);
  }
  .map-placeholder.hidden{display:none;}
  .map-placeholder svg{width:54px;height:54px;color:rgba(255,107,74,.4);}
  .map-placeholder h3{font-size:15px;font-weight:700;color:var(--ink-soft);}
  .map-placeholder p{font-size:12.5px;color:var(--muted);line-height:1.7;max-width:320px;}
  .route-card{
    position:absolute;left:20px;bottom:20px;width:min(360px,calc(100% - 40px));
    background:rgba(255,255,255,.92);backdrop-filter:blur(18px);border-radius:18px;
    padding:16px 16px 14px;box-shadow:0 20px 40px -18px rgba(15,23,42,.45);
    border:1px solid rgba(255,255,255,.9);transform:translateY(140%);opacity:0;
    transition:.35s cubic-bezier(.2,.8,.3,1.1);z-index:6;
  }
  .route-card.show{transform:translateY(0);opacity:1;}
  .route-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .route-head h3{font-size:14px;font-weight:700;line-height:1.4;}
  .route-head .close-route{border:none;background:rgba(15,23,42,.06);width:26px;height:26px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:14px;line-height:1;flex:none;}
  .route-stats{display:flex;gap:16px;margin-top:11px;}
  .route-stat{display:flex;flex-direction:column;gap:2px;}
  .route-stat b{font-size:17px;font-weight:800;color:var(--brand-1);}
  .route-stat span{font-size:11px;color:var(--muted);}
  .route-steps{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:12px;color:var(--ink-soft);line-height:1.75;max-height:96px;overflow-y:auto;}
  .route-steps::-webkit-scrollbar{width:5px;}
  .route-steps::-webkit-scrollbar-thumb{background:rgba(15,23,42,.15);border-radius:99px;}
  .map-pin{position:relative;width:30px;height:30px;display:grid;place-items:center;}
  .map-pin i{
    width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);
    background:var(--grad);border:2.5px solid #fff;box-shadow:0 6px 14px rgba(255,77,109,.55);display:block;
  }
  .map-pin i::after{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;left:50%;top:50%;transform:translate(-50%,-50%) rotate(45deg);}
  .map-pin.active i{background:linear-gradient(135deg,#ff5c8a,#ff2d55);animation:bounce .5s ease;}
  @keyframes bounce{0%,100%{transform:rotate(-45deg) scale(1)}50%{transform:rotate(-45deg) scale(1.25)}}
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(20,24,35,.45);backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;
    opacity:0;pointer-events:none;transition:.25s;
  }
  .modal-backdrop.show{opacity:1;pointer-events:auto;}
  .modal{
    width:min(520px,100%);background:#fff;border-radius:24px;padding:26px;box-shadow:0 40px 80px -30px rgba(15,23,42,.55);
    transform:translateY(16px) scale(.98);transition:.28s cubic-bezier(.2,.8,.3,1.1);
  }
  .modal-backdrop.show .modal{transform:translateY(0) scale(1);}
  .modal h2{font-size:18px;font-weight:800;display:flex;align-items:center;gap:9px;}
  .modal h2 span{width:34px;height:34px;border-radius:11px;background:var(--grad);display:grid;place-items:center;color:#fff;flex:none;}
  .modal h2 span svg{width:18px;height:18px;}
  .modal .sub{font-size:12.5px;color:var(--muted);line-height:1.7;margin-top:9px;}
  .field{margin-top:15px;}
  .field label{font-size:12.5px;font-weight:600;color:var(--ink-soft);display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .field label em{font-style:normal;font-size:11px;color:var(--muted);font-weight:400;}
  .field input{
    width:100%;margin-top:7px;height:44px;border-radius:12px;border:1.5px solid rgba(15,23,42,.1);
    padding:0 13px;font-family:inherit;font-size:13px;outline:none;transition:.2s;background:#fbfbfc;
  }
  .field input:focus{border-color:rgba(255,107,74,.6);background:#fff;box-shadow:0 0 0 4px rgba(255,107,74,.1);}
  .modal-links{display:flex;gap:16px;margin-top:14px;flex-wrap:wrap;}
  .modal-links a{font-size:12px;color:#1d6dd1;text-decoration:none;}
  .modal-links a:hover{text-decoration:underline;}
  .modal-actions{display:flex;gap:10px;margin-top:20px;}
  .modal-actions .btn{flex:1;justify-content:center;}
  .toast{
    position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);opacity:0;pointer-events:none;
    background:rgba(31,36,48,.92);color:#fff;font-size:13px;padding:11px 20px;border-radius:12px;
    box-shadow:0 18px 40px -16px rgba(0,0,0,.5);transition:.3s;z-index:80;max-width:80vw;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}
  .demo-tip{font-size:11px;color:#b26a2b;background:rgba(255,159,69,.12);border:1px solid rgba(255,159,69,.25);padding:7px 12px;border-radius:10px;margin-top:10px;display:none;}
  .demo-tip.show{display:block;}
  .info-window{padding:2px 2px 4px;min-width:190px;font-family:inherit;}
  .info-window h4{font-size:14px;font-weight:700;margin-bottom:6px;}
  .info-window .iw-meta{font-size:12px;color:#7a8194;line-height:1.7;}
  .info-window .iw-reason{margin-top:7px;font-size:12px;color:#c94e2c;line-height:1.6;background:rgba(255,107,74,.08);padding:7px 9px;border-radius:8px;}
  @media (max-width:940px){
    body{overflow:auto;}
    .topbar{height:auto;flex-wrap:wrap;padding:14px 16px;}
    .loc-chip{max-width:100%;order:3;width:100%;}
    .layout{grid-template-columns:1fr;height:auto;padding:0 14px 20px;gap:14px;}
    .panel{max-height:none;min-height:420px;}
    .list{max-height:52vh;}
    .map-wrap{height:380px;order:-1;}
    .brand h1{font-size:17px;}
    .topbar-actions{gap:8px;}
  }
</style>
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 21s-6.5-5.3-6.5-10.1A6.5 6.5 0 0 1 12 4.4a6.5 6.5 0 0 1 6.5 6.5C18.5 15.7 12 21 12 21z"/>
        <circle cx="12" cy="10.6" r="2.2"/>
      </svg>
    </div>
    <div>
      <h1>校园美食地图助手</h1>
      <p>Campus Food Map Assistant</p>
    </div>
  </div>
  <div class="topbar-actions">
    <div class="loc-chip" id="locChip">
      <span class="dot pending" id="locDot"></span>
      <span id="locText">正在获取位置…</span>
    </div>
    <button class="btn ghost" id="btnConfig">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      配置 Key
    </button>
    <button class="btn primary" id="btnLocate">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      重新定位
    </button>
  </div>
</header>

<main class="layout">
  <section class="panel">
    <div class="search-row">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="searchInput" type="text" placeholder="搜索川菜、烧烤、奶茶、火锅…" autocomplete="off">
      </div>
      <button class="btn primary" id="btnSearch">搜索</button>
    </div>

    <div class="quick-tags" id="quickTags">
      <button class="quick-tag" data-kw="川菜">川菜</button>
      <button class="quick-tag" data-kw="火锅">火锅</button>
      <button class="quick-tag" data-kw="日料">日料</button>
      <button class="quick-tag" data-kw="烧烤">烧烤</button>
      <button class="quick-tag" data-kw="奶茶">奶茶</button>
      <button class="quick-tag" data-kw="小吃">小吃</button>
    </div>

    <div class="filters">
      <div class="filter-group">
        <span class="filter-label">价格</span>
        <div class="chips" id="priceChips">
          <button class="chip active" data-price="all">全部</button>
          <button class="chip" data-price="low">平价 &lt;30</button>
          <button class="chip" data-price="mid">中档 30-80</button>
          <button class="chip" data-price="high">高档 &gt;80</button>
        </div>
      </div>
      <div class="filter-group">
        <span class="filter-label">口味</span>
        <div class="chips" id="cuisineChips">
          <button class="chip active" data-cuisine="all">全部</button>
          <button class="chip" data-cuisine="川菜">川菜</button>
          <button class="chip" data-cuisine="粤菜">粤菜</button>
          <button class="chip" data-cuisine="日料">日料</button>
          <button class="chip" data-cuisine="西餐">西餐</button>
          <button class="chip" data-cuisine="小吃">小吃</button>
          <button class="chip" data-cuisine="奶茶">奶茶</button>
        </div>
      </div>
    </div>

    <div class="list-head">
      <h2>周边美食 <span class="count" id="resultCount">0</span></h2>
      <div class="sort-group" id="sortGroup">
        <button class="sort-btn active" data-sort="distance">距离最近</button>
        <button class="sort-btn" data-sort="rating">评分最高</button>
      </div>
    </div>

    <div class="demo-tip" id="demoTip">当前为内置演示数据 · 配置高德 Key 后将检索真实餐厅</div>
    <div class="list" id="restaurantList"></div>
  </section>

  <section class="map-wrap">
    <div id="map"></div>
    <div class="map-placeholder" id="mapPlaceholder">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 20 3 17V4l6 3 6-3 6 3v13l-6-3-6 3z"/><path d="M9 7v13M15 4v13"/></svg>
      <h3>地图待激活</h3>
      <p>填写「Web 端（JS API）Key」后即可展示高德地图。<br>未配置时仍可使用搜索、筛选和路线规划。</p>
      <button class="btn primary" id="btnConfigFromMap">去配置 Key</button>
    </div>

    <div class="route-card" id="routeCard">
      <div class="route-head">
        <h3 id="routeTitle">路线规划</h3>
        <button class="close-route" id="closeRoute" aria-label="关闭">×</button>
      </div>
      <div class="route-stats">
        <div class="route-stat"><b id="routeDistance">—</b><span>预计距离</span></div>
        <div class="route-stat"><b id="routeDuration">—</b><span>预计时间</span></div>
      </div>
      <div class="route-steps" id="routeSteps"></div>
    </div>
  </section>
</main>

<div class="modal-backdrop" id="configModal">
  <div class="modal">
    <h2><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 2l-2 2m-7.6 7.6a5.5 5.5 0 1 1-7.8 7.8 5.5 5.5 0 0 1 7.8-7.8zm0 0L15.5 7.5m0 0 3 3L22 7l-3-3"/></svg></span>配置高德地图 Key</h2>
    <p class="sub">Key 仅保存在本机浏览器 localStorage，不会上传到代码仓库。</p>

    <div class="field">
      <label>Web 服务 Key <em>必填 · 用于搜索与路线</em></label>
      <input id="inputRestKey" type="text" placeholder="例如 a1b2c3d4e5...">
    </div>
    <div class="field">
      <label>Web 端（JS API）Key <em>选填 · 用于校园定位与地图</em></label>
      <input id="inputJsKey" type="text" placeholder="用于 AMap.Geolocation 定位与地图底图">
    </div>
    <div class="field">
      <label>安全密钥 securityJsCode <em>选填 · JS API 2.0 需要</em></label>
      <input id="inputSecret" type="text" placeholder="与 JS API Key 配套的安全密钥">
    </div>

    <div class="modal-links">
      <a href="https://lbs.amap.com/" target="_blank" rel="noopener">高德开放平台</a>
      <a href="https://console.amap.com/dev/key/app" target="_blank" rel="noopener">我的应用与 Key</a>
      <a href="https://lbs.amap.com/api/javascript-api-v2/guide/abc/jscode" target="_blank" rel="noopener">安全密钥说明</a>
    </div>

    <div class="modal-actions">
      <button class="btn ghost" id="btnDemo">先用演示数据</button>
      <button class="btn primary" id="btnSaveConfig">保存并刷新</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  'use strict';

  const STORAGE = { rest: 'cfm_rest_key', js: 'cfm_js_key', secret: 'cfm_js_secret' };
  const DEFAULT_CENTER = { lng: 116.3565, lat: 39.9845 };
  const DEFAULT_CITY = '北京';

  const MOCK_RESTAURANTS = [
    { id: 'm01', name: '川渝人家川菜馆', cuisine: '川菜', cost: 28, rating: 4.6, lng: 116.3621, lat: 39.9845, address: '学院路 32 号' },
    { id: 'm02', name: '老北京炸酱面', cuisine: '小吃', cost: 22, rating: 4.4, lng: 116.3542, lat: 39.9901, address: '志新路 8 号' },
    { id: 'm03', name: '樱花日料居酒屋', cuisine: '日料', cost: 88, rating: 4.7, lng: 116.3588, lat: 39.9800, address: '学院路 15 号' },
    { id: 'm04', name: '芝士披萨工坊', cuisine: '西餐', cost: 65, rating: 4.3, lng: 116.3501, lat: 39.9878, address: '北四环中路 6 号' },
    { id: 'm05', name: '港式茶餐厅', cuisine: '粤菜', cost: 55, rating: 4.5, lng: 116.3655, lat: 39.9880, address: '学院路 40 号' },
    { id: 'm06', name: '蜜雪冰城（学院路店）', cuisine: '奶茶', cost: 12, rating: 4.2, lng: 116.3570, lat: 39.9830, address: '学院路 20 号' },
    { id: 'm07', name: '重庆老火锅', cuisine: '川菜', cost: 72, rating: 4.8, lng: 116.3600, lat: 39.9750, address: '知春路 66 号' },
    { id: 'm08', name: '沙县小吃', cuisine: '小吃', cost: 18, rating: 4.0, lng: 116.3530, lat: 39.9850, address: '学院路 12 号' },
    { id: 'm09', name: '寿司郎', cuisine: '日料', cost: 120, rating: 4.4, lng: 116.3680, lat: 39.9820, address: '中关村东路 18 号' },
    { id: 'm10', name: '兰州牛肉面', cuisine: '小吃', cost: 20, rating: 4.1, lng: 116.3560, lat: 39.9790, address: '学院路 9 号' },
    { id: 'm11', name: '一点点奶茶', cuisine: '奶茶', cost: 15, rating: 4.3, lng: 116.3595, lat: 39.9865, address: '学院路 27 号' },
    { id: 'm12', name: '粤味烧腊', cuisine: '粤菜', cost: 42, rating: 4.2, lng: 116.3510, lat: 39.9920, address: '花园路 5 号' }
  ];

  const state = {
    userLoc: { ...DEFAULT_CENTER },
    city: DEFAULT_CITY,
    address: '北京市海淀区学院路（演示位置）',
    restaurants: [],
    filtered: [],
    priceLevel: 'all',
    cuisine: 'all',
    sortBy: 'distance',
    selectedId: null,
    usingDemo: true,
    map: null,
    mapReady: false,
    mapLoading: false,
    markers: new Map(),
    infoWindow: null,
    routeLine: null,
    amapKeyTried: ''
  };

  const $ = (id) => document.getElementById(id);
  const els = {
    locChip: $('locChip'), locDot: $('locDot'), locText: $('locText'),
    searchInput: $('searchInput'), btnSearch: $('btnSearch'), quickTags: $('quickTags'),
    priceChips: $('priceChips'), cuisineChips: $('cuisineChips'), sortGroup: $('sortGroup'),
    resultCount: $('resultCount'), restaurantList: $('restaurantList'), demoTip: $('demoTip'),
    map: $('map'), mapPlaceholder: $('mapPlaceholder'), btnConfigFromMap: $('btnConfigFromMap'),
    routeCard: $('routeCard'), routeTitle: $('routeTitle'), routeDistance: $('routeDistance'),
    routeDuration: $('routeDuration'), routeSteps: $('routeSteps'), closeRoute: $('closeRoute'),
    configModal: $('configModal'), inputRestKey: $('inputRestKey'), inputJsKey: $('inputJsKey'),
    inputSecret: $('inputSecret'), btnDemo: $('btnDemo'), btnSaveConfig: $('btnSaveConfig'),
    toast: $('toast'), btnConfig: $('btnConfig'), btnLocate: $('btnLocate')
  };

  const getStored = (key) => {
    try { return localStorage.getItem(key) || ''; } catch (err) { return ''; }
  };
  const setStored = (key, value) => {
    try { localStorage.setItem(key, value); } catch (err) { /* ignore */ }
  };
  const escapeHtml = (text) => String(text == null ? '' : text).replace(/[&<>"']/g, (ch) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[ch]);

  const toast = (message) => {
    els.toast.textContent = message;
    els.toast.classList.add('show');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => els.toast.classList.remove('show'), 2400);
  };

  const haversine = (a, b) => {
    const R = 6371000;
    const rad = Math.PI / 180;
    const dLat = (b.lat - a.lat) * rad;
    const dLng = (b.lng - a.lng) * rad;
    const s = Math.sin(dLat / 2) ** 2 +
      Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(s));
  };

  const formatDistance = (meters) => {
    if (!Number.isFinite(meters) || meters <= 0) return '—';
    return meters >= 1000 ? `${(meters / 1000).toFixed(1)}km` : `${Math.round(meters)}m`;
  };

  const inferCuisine = (name, typeText) => {
    const text = `${name || ''} ${typeText || ''}`;
    if (/奶茶|茶饮|咖啡|饮品|甜品|冰淇淋/.test(text)) return '奶茶';
    if (/日料|寿司|日本|居酒屋|拉面/.test(text)) return '日料';
    if (/粤菜|港式|茶餐厅|烧腊|广式/.test(text)) return '粤菜';
    if (/西餐|披萨|意面|牛排|汉堡|炸鸡/.test(text)) return '西餐';
    if (/川菜|火锅|麻辣|水煮|串串|重庆/.test(text)) return '川菜';
    return '小吃';
  };

  const defaultCost = (cuisine) => ({ 川菜: 55, 粤菜: 60, 日料: 90, 西餐: 70, 小吃: 22, 奶茶: 18 }[cuisine] || 45);

  const priceLevelOf = (cost) => {
    if (cost < 30) return 'low';
    if (cost <= 80) return 'mid';
    return 'high';
  };

  const buildReason = (item) => {
    const parts = [`这家${item.cuisine}店人均${item.cost}元`];
    if (item.rating >= 4.6) parts.push('评分很高');
    else if (item.rating >= 4.0) parts.push('口碑不错');
    if (item.distance < 1000) parts.push(`步行${Math.max(1, Math.round(item.distance / 80))}分钟可达`);
    else parts.push(`距离约${(item.distance / 1000).toFixed(1)}公里`);
    parts.push(item.cost < 30 ? '适合日常简餐' : (item.cost <= 80 ? '适合宿舍聚餐' : '适合周末犒劳自己'));
    return `${parts.join('，')}。`;
  };

  const fetchJson = async (url, timeout = 9000) => {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeout);
    try {
      const response = await fetch(url, { signal: controller.signal });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return await response.json();
    } finally {
      clearTimeout(timer);
    }
  };

  const applyLocation = (lng, lat, address) => {
    state.userLoc = { lng, lat };
    if (address) state.address = address;
    els.locText.textContent = state.address;
    els.locDot.classList.remove('pending');
    els.locDot.style.background = '#22c55e';
    els.locDot.style.boxShadow = '0 0 0 4px rgba(34,197,94,.16)';
  };

  const setLocationPending = (text) => {
    els.locText.textContent = text;
    els.locDot.classList.add('pending');
  };

  const reverseGeocode = (lng, lat) => new Promise((resolve) => {
    if (!window.AMap) {
      resolve('');
      return;
    }
    window.AMap.plugin('AMap.Geocoder', () => {
      const geocoder = new window.AMap.Geocoder({ city: state.city, radius: 1000 });
      geocoder.getAddress([lng, lat], (status, result) => {
        if (status === 'complete' && result && result.regeocode) {
          resolve(result.regeocode.formattedAddress || '');
        } else {
          resolve('');
        }
      });
    });
  });

  const locate = async () => {
    setLocationPending('正在获取位置…');

    if (!window.AMap) {
      applyLocation(DEFAULT_CENTER.lng, DEFAULT_CENTER.lat, '北京市海淀区学院路（演示位置）');
      state.city = DEFAULT_CITY;
      return;
    }

    try {
      const position = await new Promise((resolve, reject) => {
        window.AMap.plugin(['AMap.CitySearch', 'AMap.Geolocation'], () => {
          const citySearch = new window.AMap.CitySearch();
          citySearch.getLocalCity((cityStatus, cityResult) => {
            const hasCity = cityStatus === 'complete' && cityResult && cityResult.city;
            const city = hasCity ? cityResult.city : DEFAULT_CITY;
            state.city = city;

            const geolocation = new window.AMap.Geolocation({
              enableHighAccuracy: true,
              timeout: 10000,
              city,
              citylimit: Boolean(hasCity),
              noIpLocate: 0,
              GeoLocationFirst: true
            });

            geolocation.getCurrentPosition((geoStatus, geoResult) => {
              if (geoStatus === 'complete' && geoResult && geoResult.position) {
                resolve({
                  lng: geoResult.position.lng,
                  lat: geoResult.position.lat,
                  address: geoResult.formattedAddress || ''
                });
              } else {
                reject(new Error((geoResult && geoResult.message) || '浏览器定位失败'));
              }
            });
          });
        });
      });

      let address = position.address;
      if (!address) address = await reverseGeocode(position.lng, position.lat);
      applyLocation(position.lng, position.lat, address || `${state.city}（已定位）`);

      if (state.mapReady && state.map) {
        state.map.setZoomAndCenter(14, [position.lng, position.lat], false, 300);
      }
    } catch (err) {
      applyLocation(DEFAULT_CENTER.lng, DEFAULT_CENTER.lat, '北京市海淀区学院路（定位降级）');
      state.city = DEFAULT_CITY;
      toast('定位失败：请在 localhost 或 HTTPS 下允许浏览器定位');
    }
  };

  const normalizePoi = (poi) => {
    const lng = Number(poi.location ? poi.location.split(',')[0] : 0);
    const lat = Number(poi.location ? poi.location.split(',')[1] : 0);
    const cuisine = inferCuisine(poi.name, poi.type);
    const biz = poi.biz_ext || {};
    const rating = Number.parseFloat(Array.isArray(biz.rating) ? biz.rating[0] : biz.rating);
    const rawCost = Number.parseFloat(Array.isArray(biz.cost) ? biz.cost[0] : biz.cost);
    const cost = Number.isFinite(rawCost) && rawCost > 0 ? Math.round(rawCost) : defaultCost(cuisine);
    const apiDistance = Number.parseFloat(Array.isArray(poi.distance) ? poi.distance[0] : poi.distance);
    const distance = Number.isFinite(apiDistance) && apiDistance > 0
      ? apiDistance
      : haversine(state.userLoc, { lng, lat });

    return {
      id: String(poi.id || `poi-${lng}-${lat}-${poi.name || ''}`),
      name: poi.name || '未命名餐厅',
      cuisine,
      cost,
      rating: Number.isFinite(rating) && rating > 0 ? rating : 4.0,
      lng,
      lat,
      address: typeof poi.address === 'string' && poi.address ? poi.address : '地址未提供',
      distance
    };
  };

  const searchRemote = async (keyword) => {
    const key = getStored(STORAGE.rest);
    const city = state.city || DEFAULT_CITY;
    const params = new URLSearchParams({
      key,
      keywords: keyword || '美食',
      city,
      citylimit: 'true',
      offset: '25',
      page: '1',
      extensions: 'all',
      sortrule: 'distance',
      location: `${state.userLoc.lng},${state.userLoc.lat}`
    });
    const data = await fetchJson(`https://restapi.amap.com/v3/place/text?${params.toString()}`);
    if (data.status !== '1') throw new Error(data.info || 'POI 搜索失败');
    const pois = Array.isArray(data.pois) ? data.pois : [];
    if (!pois.length) throw new Error('附近没有匹配结果');
    return pois.filter((poi) => poi.location).map(normalizePoi);
  };

  const searchMock = (keyword) => {
    const term = (keyword || '').trim();
    const source = MOCK_RESTAURANTS.map((item) => {
      const distance = haversine(state.userLoc, { lng: item.lng, lat: item.lat });
      return { ...item, distance };
    });
    if (!term || /^(美食|餐厅|附近|好吃)$/.test(term)) return source;
    return source.filter((item) => item.name.includes(term) || item.cuisine.includes(term) || term.includes(item.cuisine));
  };

  const search = async (keyword) => {
    const term = (keyword == null ? els.searchInput.value : keyword).trim();
    els.searchInput.value = term;
    els.btnSearch.disabled = true;
    els.btnSearch.textContent = '搜索中';
    const key = getStored(STORAGE.rest);
    state.usingDemo = !key;

    try {
      let results;
      if (key) {
        results = await searchRemote(term);
        state.usingDemo = false;
      } else {
        results = searchMock(term);
        state.usingDemo = true;
      }
      if (!results.length) {
        state.restaurants = [];
        state.filtered = [];
        renderList();
        renderMarkers();
        toast('没有找到匹配的餐厅，换个关键词试试');
        return;
      }
      results.forEach((item) => {
        if (!item.reason) item.reason = buildReason(item);
      });
      state.restaurants = results;
      applyFilters();
      els.demoTip.classList.toggle('show', state.usingDemo);
      toast(`已找到 ${results.length} 家餐厅`);
    } catch (err) {
      const fallback = searchMock(term);
      state.usingDemo = true;
      state.restaurants = fallback.map((item) => ({ ...item, reason: buildReason(item) }));
      applyFilters();
      els.demoTip.classList.add('show');
      toast(key ? '真实接口不可用，已切换演示数据' : '已加载演示数据');
    } finally {
      els.btnSearch.disabled = false;
      els.btnSearch.textContent = '搜索';
    }
  };

  const applyFilters = () => {
    let list = state.restaurants.slice();

    if (state.priceLevel !== 'all') {
      list = list.filter((item) => priceLevelOf(item.cost) === state.priceLevel);
    }
    if (state.cuisine !== 'all') {
      list = list.filter((item) => item.cuisine === state.cuisine);
    }
    list.sort((a, b) => {
      if (state.sortBy === 'rating') {
        if (b.rating !== a.rating) return b.rating - a.rating;
        return a.distance - b.distance;
      }
      return a.distance - b.distance;
    });

    state.filtered = list;
    renderList();
    renderMarkers();
  };

  const cardTemplate = (item, index) => `
    <article class="food-card${item.id === state.selectedId ? ' selected' : ''}" data-id="${escapeHtml(item.id)}">
      <div class="card-top">
        <div class="rank">${String(index + 1).padStart(2, '0')}</div>
        <div class="card-main">
          <div class="card-title-row">
            <h3>${escapeHtml(item.name)}</h3>
            <span class="rating">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.4-5.8-3-5.8 3 1.1-6.4L2.6 9.4l6.5-.9z"/></svg>
              ${item.rating.toFixed(1)}
            </span>
          </div>
          <div class="card-meta">
            <span class="badge cuisine">${escapeHtml(item.cuisine)}</span>
            <span class="badge price">¥${item.cost}/人</span>
            <span class="badge dist">${formatDistance(item.distance)}</span>
          </div>
          <p class="reason">${escapeHtml(item.reason || buildReason(item))}</p>
        </div>
      </div>
      <div class="card-actions">
        <button class="btn tiny route-btn" data-route="${escapeHtml(item.id)}">去这里</button>
      </div>
    </article>
  `;

  const renderList = () => {
    els.resultCount.textContent = String(state.filtered.length);
    if (!state.filtered.length) {
      els.restaurantList.innerHTML = `
        <div class="empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <div>没有符合条件的餐厅<br>试试放宽筛选条件</div>
        </div>`;
      return;
    }
    const fragment = document.createDocumentFragment();
    const wrapper = document.createElement('div');
    wrapper.innerHTML = state.filtered.map(cardTemplate).join('');
    while (wrapper.firstElementChild) fragment.appendChild(wrapper.firstElementChild);
    els.restaurantList.replaceChildren(fragment);
  };

  const pinContent = (active) => `<div class="map-pin${active ? ' active' : ''}"><i></i></div>`;

  const infoContent = (item) => `
    <div class="info-window">
      <h4>${escapeHtml(item.name)}</h4>
      <div class="iw-meta">
        ${escapeHtml(item.cuisine)} · ¥${item.cost}/人 · 评分 ${item.rating.toFixed(1)}<br>
        距离 ${formatDistance(item.distance)} · ${escapeHtml(item.address)}
      </div>
      <div class="iw-reason">${escapeHtml(item.reason || buildReason(item))}</div>
    </div>
  `;

  const clearMarkers = () => {
    state.markers.forEach((marker) => {
      if (state.map) state.map.remove(marker);
    });
    state.markers.clear();
  };

  const renderMarkers = () => {
    if (!state.mapReady || !state.map || !window.AMap) return;
    clearMarkers();

    const list = state.filtered.slice();
    let cursor = 0;
    const batchSize = 8;

    const renderBatch = () => {
      const chunk = list.slice(cursor, cursor + batchSize);
      chunk.forEach((item) => {
        const marker = new window.AMap.Marker({
          position: [item.lng, item.lat],
          content: pinContent(item.id === state.selectedId),
          anchor: 'bottom-center',
          extData: { id: item.id },
          zIndex: item.id === state.selectedId ? 120 : 100
        });
        marker.on('click', () => {
          selectRestaurant(item.id, { fromMarker: true });
        });
        marker.setMap(state.map);
        state.markers.set(item.id, marker);
      });
      cursor += batchSize;
      if (cursor < list.length) requestAnimationFrame(renderBatch);
    };
    renderBatch();
  };

  const openInfoWindow = (item) => {
    if (!state.mapReady || !state.infoWindow) return;
    state.infoWindow.setContent(infoContent(item));
    state.infoWindow.open(state.map, [item.lng, item.lat]);
  };

  const selectRestaurant = (id, options = {}) => {
    const item = state.restaurants.find((entry) => entry.id === id);
    if (!item) return;
    state.selectedId = id;

    els.restaurantList.querySelectorAll('.food-card').forEach((card) => {
      card.classList.toggle('selected', card.dataset.id === id);
    });

    if (!options.fromMarker && state.mapReady && state.map) {
      state.map.setZoomAndCenter(15, [item.lng, item.lat], false, 260);
    }
    openInfoWindow(item);
    renderMarkers();
  };

  const ensureMap = async () => {
    const jsKey = getStored(STORAGE.js);
    if (!jsKey) {
      els.mapPlaceholder.classList.remove('hidden');
      return;
    }
    if (state.mapReady || state.mapLoading) return;
    if (state.amapKeyTried === jsKey) return;

    state.mapLoading = true;
    state.amapKeyTried = jsKey;
    const secret = getStored(STORAGE.secret);
    if (secret) window._AMapSecurityConfig = { securityJsCode: secret };

    try {
      await new Promise((resolve, reject) => {
        if (window.AMap) return resolve();
        const script = document.createElement('script');
        script.src = `https://webapi.amap.com/maps?v=2.0&key=${encodeURIComponent(jsKey)}`;
        script.async = true;
        script.onload = resolve;
        script.onerror = () => reject(new Error('AMap 脚本加载失败'));
        document.head.appendChild(script);
      });

      state.map = new window.AMap.Map('map', {
        zoom: 14,
        center: [state.userLoc.lng, state.userLoc.lat],
        zooms: [12, 18],
        enableHighResolution: false,
        fadeEffect: false,
        viewMode: '2D',
        mapStyle: 'amap://styles/whitesmoke'
      });

      state.infoWindow = new window.AMap.InfoWindow({
        offset: new window.AMap.Pixel(0, -34),
        isCustom: false
      });

      state.mapReady = true;
      els.mapPlaceholder.classList.add('hidden');
      renderMarkers();
      toast('地图已激活');
    } catch (err) {
      els.mapPlaceholder.classList.remove('hidden');
      toast('地图加载失败，请检查 JS API Key 与安全密钥');
    } finally {
      state.mapLoading = false;
    }
  };

  const clearRoute = () => {
    if (state.routeLine && state.map) {
      state.map.remove(state.routeLine);
    }
    state.routeLine = null;
    els.routeCard.classList.remove('show');
  };

  const drawRoute = (pathPoints) => {
    if (!state.mapReady || !state.map || !window.AMap || !pathPoints.length) return;
    if (state.routeLine) state.map.remove(state.routeLine);
    state.routeLine = new window.AMap.Polyline({
      path: pathPoints,
      strokeColor: '#ff5c8a',
      strokeWeight: 7,
      strokeOpacity: 0.9,
      lineJoin: 'round',
      lineCap: 'round',
      showDir: true,
      borderWeight: 2,
      outlineColor: '#ffffff'
    });
    state.routeLine.setMap(state.map);
    state.map.setFitView([state.routeLine], false, [90, 60, 90, 60]);
  };

  const parsePolyline = (polylineText) => {
    if (!polylineText || typeof polylineText !== 'string') return [];
    return polylineText
      .split(';')
      .map((pair) => pair.split(',').map(Number))
      .filter((point) => point.length === 2 && Number.isFinite(point[0]) && Number.isFinite(point[1]));
  };

  const showRouteCard = (title, distanceText, durationText, steps) => {
    els.routeTitle.textContent = title;
    els.routeDistance.textContent = distanceText;
    els.routeDuration.textContent = durationText;
    els.routeSteps.innerHTML = steps.map((step) => `<div>· ${escapeHtml(step)}</div>`).join('');
    els.routeCard.classList.add('show');
  };

  const planRoute = async (id) => {
    const item = state.restaurants.find((entry) => entry.id === id);
    if (!item) return;
    selectRestaurant(id);
    const key = getStored(STORAGE.rest);

    if (!key) {
      const straight = haversine(state.userLoc, { lng: item.lng, lat: item.lat });
      const walk = Math.max(1, Math.round(straight / 80));
      showRouteCard(`前往 ${item.name}（演示路线）`, formatDistance(straight), `步行约${walk}分钟`, [
        `从当前位置出发，朝${item.name}方向前进`,
        `按地图指引步行约 ${Math.round(straight)} 米`,
        '到达目的地'
      ]);
      if (state.mapReady) {
        drawRoute([[state.userLoc.lng, state.userLoc.lat], [item.lng, item.lat]]);
      }
      toast('演示路线 · 配置 Key 后获取真实步行路线');
      return;
    }

    els.routeTitle.textContent = '正在规划路线…';
    els.routeCard.classList.add('show');
    els.routeDistance.textContent = '…';
    els.routeDuration.textContent = '…';
    els.routeSteps.innerHTML = '<div>正在请求高德步行路线规划</div>';

    try {
      const params = new URLSearchParams({
        key,
        origin: `${state.userLoc.lng},${state.userLoc.lat}`,
        destination: `${item.lng},${item.lat}`,
        steps: 'true'
      });
      const data = await fetchJson(`https://restapi.amap.com/v3/direction/walking?${params.toString()}`);
      if (data.status !== '1' || !data.route || !data.route.paths || !data.route.paths.length) {
        throw new Error(data.info || '未获取到路线');
      }
      const path = data.route.paths[0];
      const distance = Number(path.distance) || 0;
      const duration = Number(path.duration) || 0;
      const steps = (path.steps || []).slice(0, 8).map((step) => step.instruction).filter(Boolean);
      const allPoints = [];
      (path.steps || []).forEach((step) => {
        allPoints.push(...parsePolyline(step.polyline));
      });

      showRouteCard(
        `前往 ${item.name}`,
        distance >= 1000 ? `${(distance / 1000).toFixed(1)}km` : `${distance}m`,
        `步行约${Math.max(1, Math.round(duration / 60))}分钟`,
        steps.length ? steps : ['沿导航路线步行前往']
      );
      drawRoute(allPoints);
    } catch (err) {
      const straight = haversine(state.userLoc, { lng: item.lng, lat: item.lat });
      showRouteCard(`前往 ${item.name}（估算）`, formatDistance(straight), `步行约${Math.max(1, Math.round(straight / 80))}分钟`, [
        '真实路线接口暂不可用，以下为直线距离估算',
        '请以高德地图导航为准'
      ]);
      toast('路线规划失败，已显示估算结果');
    }
  };

  const openConfig = () => {
    els.inputRestKey.value = getStored(STORAGE.rest);
    els.inputJsKey.value = getStored(STORAGE.js);
    els.inputSecret.value = getStored(STORAGE.secret);
    els.configModal.classList.add('show');
  };

  const closeConfig = () => els.configModal.classList.remove('show');

  const saveConfig = () => {
    const rest = els.inputRestKey.value.trim();
    const js = els.inputJsKey.value.trim();
    const secret = els.inputSecret.value.trim();

    setStored(STORAGE.rest, rest);
    setStored(STORAGE.js, js);
    setStored(STORAGE.secret, secret);

    state.amapKeyTried = '';
    if (state.map) {
      try { state.map.destroy(); } catch (err) { /* ignore */ }
      state.map = null;
      state.mapReady = false;
      state.markers.clear();
    }

    closeConfig();
    toast('配置已保存');
    locate().then(() => {
      ensureMap();
      search(els.searchInput.value.trim());
    });
  };

  const bindEvents = () => {
    els.btnSearch.addEventListener('click', () => search());
    els.searchInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') search();
    });

    els.quickTags.addEventListener('click', (event) => {
      const button = event.target.closest('[data-kw]');
      if (!button) return;
      search(button.dataset.kw);
    });

    els.priceChips.addEventListener('click', (event) => {
      const button = event.target.closest('[data-price]');
      if (!button) return;
      state.priceLevel = button.dataset.price;
      els.priceChips.querySelectorAll('.chip').forEach((chip) => chip.classList.toggle('active', chip === button));
      applyFilters();
    });

    els.cuisineChips.addEventListener('click', (event) => {
      const button = event.target.closest('[data-cuisine]');
      if (!button) return;
      state.cuisine = button.dataset.cuisine;
      els.cuisineChips.querySelectorAll('.chip').forEach((chip) => chip.classList.toggle('active', chip === button));
      applyFilters();
    });

    els.sortGroup.addEventListener('click', (event) => {
      const button = event.target.closest('[data-sort]');
      if (!button) return;
      state.sortBy = button.dataset.sort;
      els.sortGroup.querySelectorAll('.sort-btn').forEach((item) => item.classList.toggle('active', item === button));
      applyFilters();
    });

    els.restaurantList.addEventListener('click', (event) => {
      const routeButton = event.target.closest('[data-route]');
      if (routeButton) {
        event.stopPropagation();
        planRoute(routeButton.dataset.route);
        return;
      }
      const card = event.target.closest('.food-card');
      if (card) selectRestaurant(card.dataset.id);
    });

    els.closeRoute.addEventListener('click', clearRoute);
    els.btnConfig.addEventListener('click', openConfig);
    els.btnConfigFromMap.addEventListener('click', openConfig);
    els.btnLocate.addEventListener('click', async () => {
      await locate();
      if (state.mapReady && state.map) {
        state.map.setZoomAndCenter(14, [state.userLoc.lng, state.userLoc.lat], false, 300);
      }
      search(els.searchInput.value.trim());
    });

    els.btnSaveConfig.addEventListener('click', saveConfig);
    els.btnDemo.addEventListener('click', () => {
      closeConfig();
      search(els.searchInput.value.trim());
      toast('已使用内置演示数据');
    });
    els.configModal.addEventListener('click', (event) => {
      if (event.target === els.configModal) closeConfig();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        closeConfig();
        clearRoute();
      }
    });
  };

  const boot = async () => {
    bindEvents();
    await ensureMap();
    await locate();
    await search('');

    if (!getStored(STORAGE.rest) && !getStored(STORAGE.js)) {
      setTimeout(openConfig, 700);
    }
  };

  boot();
})();
</script>
</body>
</html>
